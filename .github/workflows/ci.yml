name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The committed lockfile was generated on macOS and omits the Linux
        # native binaries (lightningcss/oxide). npm won't reinstate optional
        # deps missing from an existing lockfile (npm/cli#4828), so remove it
        # and let the Linux runner resolve platform binaries fresh, as Vercel does.
        run: rm -f package-lock.json && npm install

      - name: Lint
        run: npm run lint:web

      - name: Build
        run: npm run build:web

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/devos-api ./cmd/api

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) so the Linux runner resolves
        # platform-specific native binaries (e.g. lightningcss-linux-x64-gnu)
        # that the macOS-generated lockfile does not record. Matches Vercel.
        run: npm install

      - name: Lint
        run: npm run lint:web

      - name: Build
        run: npm run build:web

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/devos-api ./cmd/api

# Render Blueprint for Standup services.
# Connect this repo as a Blueprint in the Render dashboard.
services:
  - type: web
    name: standup-agent
    runtime: docker
    rootDir: apps/agent
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AGENT_SERVICE_SECRET
        generateValue: true
      - key: AGENT_MODEL_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AGENT_MODEL
        value: openai/gpt-oss-20b
      - key: AGENT_MODEL_API_KEY
        sync: false
      - key: AGENT_TIMEOUT_SECONDS
        value: "30"

  - type: web
    name: standup-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Port the container listens on (matches the Dockerfile default).
      - key: API_ADDR
        value: ":8080"
      # Internal Render network URL for the Python agent service.
      - key: AGENT_BASE_URL
        fromService:
          type: web
          name: standup-agent
          property: hostport
      - key: AGENT_SERVICE_SECRET
        fromService:
          type: web
          name: standup-agent
          envVarKey: AGENT_SERVICE_SECRET
      # Shared secret between the web app and the API. Render generates it;
      # copy the same value into Vercel's API_GATEWAY_SECRET so both sides match.
      - key: API_GATEWAY_SECRET
        generateValue: true
      # Signing secret for OAuth state.
      - key: OAUTH_STATE_SECRET
        generateValue: true
      # base64-encoded 32-byte key for sealing provider tokens. Set in the
      # dashboard before storing real provider credentials.
      - key: TOKEN_SEALING_KEY
        sync: false
      # Supabase persistence. Without both, the API falls back to in-memory.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
